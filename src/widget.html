<!doctype html>
<html lang="en" data-theme="original">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gas Notify</title>
  </head>
  <body>
    <section class="gas-notify-widget">
      <header class="gas-notify-widget__header">
        <div class="gas-notify-widget__title">
          <span class="gas-notify-widget__badge">⛽</span>
          <div class="gas-notify-widget__copy">
            <strong>Gas Notify</strong>
            <span id="gas-notify-status">Connecting…</span>
          </div>
        </div>
        <span id="gas-notify-dot" class="gas-notify-widget__status-dot" data-mode="down"></span>
      </header>
      <button id="gas-notify-suggestion" class="gas-notify-widget__suggestion" type="button" disabled title="Copy forecast" aria-label="Copy forecast">
        <span class="gas-notify-widget__suggestion-label">Forecast</span>
        <strong id="gas-notify-suggestion-value">Connecting…</strong>
        <span class="gas-notify-widget__copy-icon" aria-hidden="true">
          <svg class="gas-notify-widget__icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
          <svg class="gas-notify-widget__icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4 10-10"/></svg>
        </span>
        <span id="gas-notify-suggestion-note" role="status" hidden></span>
      </button>
      <span id="gas-notify-copy-feedback" class="gas-notify-widget__sr-only" role="status"></span>
      <div id="gas-notify-rows" class="gas-notify-widget__rows"></div>
      <footer id="gas-notify-footer" class="gas-notify-widget__footer">Waiting for first block…</footer>
    </section>
    <script type="module" src="./widget.ts"></script>
  </body>
</html>
